name: Android build

on:
  push:
    branches: [main, core/premium-stable]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    name: Build and verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Publish the built APK as soon as compilation and JVM tests pass.
      # Emulator boot or instrumentation stalls must not hide the debug artifact.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zr4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
